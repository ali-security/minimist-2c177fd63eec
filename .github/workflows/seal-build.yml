name: seal-build

on:
  workflow_dispatch: {}

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '12'
      - name: npm pack
        run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: minimist-tarball
          path: minimist-1.2.5.tgz
          if-no-files-found: error
